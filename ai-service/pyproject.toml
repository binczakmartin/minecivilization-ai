[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minecivilization-ai"
version = "0.1.0"
description = "Local cognition service for MineCivilization AI (fully offline, 127.0.0.1 only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
minecivilization-ai = "minecivilization_ai.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/minecivilization_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
