// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = '1.0.0'
group = 'ai.minecivilization'

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Local cognition service endpoint, overridable from the environment (see ../run.sh and ../.env).
// Priority: JVM system property (-Dminecivilization.ai.*) > environment variable > default.
def aiBaseUrl = providers.environmentVariable('MINECIV_AI_BASE_URL').orElse('http://127.0.0.1:8765')
def aiToken = providers.environmentVariable('MINECIV_API_TOKEN').orElse('dev-local-token')

minecraft {
    mappings channel: 'official', version: '1.21.1'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'forge.enabledGameTestNamespaces', 'minecivilization'
            // Point the mod at the local AI service started by ../run.sh
            systemProperty 'minecivilization.ai.baseUrl', aiBaseUrl.get()
            systemProperty 'minecivilization.ai.token', aiToken.get()
        }

        register('client') {
            // GLFW (used by FML's early display) may only run on the main thread, and on
            // macOS that thread must be the *first* thread in the process — i.e. the JVM
            // needs -XstartOnFirstThread. Mojang's launcher adds it via a rule in
            // version.json; the Gradle run does not, so add it ourselves. The flag is
            // macOS-only: Linux/Windows JVMs reject it outright.
            if (providers.systemProperty('os.name')
                    .map { it.toLowerCase(Locale.ROOT).contains('mac') }
                    .getOrElse(false)) {
                jvmArgs '-XstartOnFirstThread'
            }
        }

        register('server') {
            // Its own working directory, not the client's: a dedicated server
            // keeps its world in run-server/world while the client keeps its
            // single-player worlds in run/saves. Sharing one directory made the
            // two quietly fight over configs and logs.
            workingDir = layout.projectDirectory.dir('run-server')
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'minecivilization', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.1-52.1.16')

    // Plain JUnit for deterministic logic (decision schema, blueprints, BOM,
    // project lifecycle, skill registry). No Minecraft runtime needed.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
    // Report every error instead of javac's default cap of 100
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
